name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Shell syntax, synthetic decoding and repository hygiene
        run: bash scripts/check.sh
